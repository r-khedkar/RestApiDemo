<app-navbar></app-navbar>

<div class="delete-container">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg">
          <div class="card-header text-center">
            <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
            <h3 class="mt-3 mb-0">Delete User</h3>
          </div>
          <div class="card-body p-4">
            <!-- Loading State -->
            <div *ngIf="isLoading" class="text-center py-5">
              <div class="spinner-border text-danger" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <p class="mt-3 text-muted">Loading user data...</p>
            </div>

            <!-- Error Message -->
            <div *ngIf="errorMessage && !isLoading" class="alert alert-danger" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              {{ errorMessage }}
            </div>

            <!-- Success Message -->
            <div *ngIf="successMessage" class="alert alert-success" role="alert">
              <i class="bi bi-check-circle-fill me-2"></i>
              {{ successMessage }}
            </div>

            <!-- User Details -->
            <div *ngIf="user && !isLoading && !successMessage" class="text-center">
              <p class="lead mb-4">
                Are you sure you want to delete this user?
              </p>

              <div class="user-details-card p-4 mb-4">
                <div class="user-avatar mb-3">
                  <i class="bi bi-person-circle display-3 text-muted"></i>
                </div>
                <h5 class="mb-2">{{ user.fullName }}</h5>
                <p class="text-muted mb-1">
                  <i class="bi bi-at me-1"></i>
                  {{ user.username }}
                </p>
                <p class="text-muted mb-1">
                  <i class="bi bi-envelope me-1"></i>
                  {{ user.email }}
                </p>
                <p class="text-muted mb-0" *ngIf="user.createdAt">
                  <i class="bi bi-calendar-check me-1"></i>
                  Member since {{ user.createdAt | date: 'shortDate' }}
                </p>
              </div>

              <div class="alert alert-warning" role="alert">
                <i class="bi bi-info-circle-fill me-2"></i>
                <strong>Warning:</strong> This action cannot be undone!
              </div>

              <div class="d-flex justify-content-between gap-3 mt-4">
                <button
                  type="button"
                  class="btn btn-secondary flex-fill"
                  (click)="onCancel()"
                  [disabled]="isDeleting"
                >
                  <i class="bi bi-x-circle me-2"></i>
                  Cancel
                </button>
                <button
                  type="button"
                  class="btn btn-danger flex-fill"
                  (click)="onConfirmDelete()"
                  [disabled]="isDeleting"
                >
                  <i class="bi bi-trash-fill me-2"></i>
                  <span *ngIf="!isDeleting">Delete User</span>
                  <span *ngIf="isDeleting">
                    <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                    Deleting...
                  </span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="text-center mt-4">
          <button class="btn btn-link" (click)="onCancel()" [disabled]="isDeleting">
            <i class="bi bi-arrow-left me-2"></i>
            Back to User List
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
