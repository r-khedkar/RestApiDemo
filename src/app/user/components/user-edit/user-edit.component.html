<app-navbar></app-navbar>

<div class="edit-container">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg">
          <div class="card-header">
            <h3 class="mb-0">
              <i class="bi bi-pencil-square me-2"></i>
              Edit User
            </h3>
          </div>
          <div class="card-body p-4">
            <!-- Loading State -->
            <div *ngIf="isLoading" class="text-center py-5">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <p class="mt-3 text-muted">Loading user data...</p>
            </div>

            <!-- Error Message -->
            <div *ngIf="errorMessage && !isLoading" class="alert alert-danger" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              {{ errorMessage }}
            </div>

            <!-- Success Message -->
            <div *ngIf="successMessage" class="alert alert-success" role="alert">
              <i class="bi bi-check-circle-fill me-2"></i>
              {{ successMessage }}
            </div>

            <!-- Edit Form -->
            <form *ngIf="user && !isLoading" (ngSubmit)="onSubmit()" #editForm="ngForm">
              <div class="mb-4">
                <label for="userId" class="form-label">
                  <i class="bi bi-hash me-1"></i>
                  User ID
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="userId"
                  [value]="user.id"
                  disabled
                  readonly
                />
                <small class="form-text text-muted">User ID cannot be changed</small>
              </div>

              <div class="mb-4">
                <label for="fullName" class="form-label">
                  <i class="bi bi-person-fill me-1"></i>
                  Full Name
                  <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="fullName"
                  name="fullName"
                  [(ngModel)]="user.fullName"
                  required
                  placeholder="Enter full name"
                  #fullName="ngModel"
                />
                <div *ngIf="fullName.invalid && fullName.touched" class="text-danger mt-1">
                  <small>Full name is required</small>
                </div>
              </div>

              <div class="mb-4">
                <label for="username" class="form-label">
                  <i class="bi bi-at me-1"></i>
                  Username
                  <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="username"
                  name="username"
                  [(ngModel)]="user.username"
                  required
                  placeholder="Enter username"
                  #username="ngModel"
                />
                <div *ngIf="username.invalid && username.touched" class="text-danger mt-1">
                  <small>Username is required</small>
                </div>
              </div>

              <div class="mb-4">
                <label for="email" class="form-label">
                  <i class="bi bi-envelope-fill me-1"></i>
                  Email
                  <span class="text-danger">*</span>
                </label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  [(ngModel)]="user.email"
                  required
                  email
                  placeholder="Enter email address"
                  #email="ngModel"
                />
                <div *ngIf="email.invalid && email.touched" class="text-danger mt-1">
                  <small *ngIf="email.errors?.['required']">Email is required</small>
                  <small *ngIf="email.errors?.['email']">Please enter a valid email</small>
                </div>
              </div>

              <div class="mb-4" *ngIf="user.createdAt">
                <label class="form-label">
                  <i class="bi bi-calendar-check me-1"></i>
                  Created At
                </label>
                <input
                  type="text"
                  class="form-control"
                  [value]="user.createdAt | date: 'medium'"
                  disabled
                  readonly
                />
              </div>

              <div class="mb-4" *ngIf="user.lastLogin">
                <label class="form-label">
                  <i class="bi bi-clock-history me-1"></i>
                  Last Login
                </label>
                <input
                  type="text"
                  class="form-control"
                  [value]="user.lastLogin | date: 'medium'"
                  disabled
                  readonly
                />
              </div>

              <div class="d-flex justify-content-between align-items-center mt-4">
                <button
                  type="button"
                  class="btn btn-secondary"
                  (click)="onCancel()"
                >
                  <i class="bi bi-x-circle me-2"></i>
                  Cancel
                </button>
                <button
                  type="submit"
                  class="btn btn-primary"
                  [disabled]="editForm.invalid || !hasChanges()"
                >
                  <i class="bi bi-check-circle me-2"></i>
                  Save Changes
                </button>
              </div>

              <div *ngIf="!hasChanges()" class="text-muted text-center mt-3">
                <small>
                  <i class="bi bi-info-circle me-1"></i>
                  No changes detected
                </small>
              </div>
            </form>
          </div>
        </div>

        <div class="text-center mt-4">
          <button class="btn btn-link" (click)="onCancel()">
            <i class="bi bi-arrow-left me-2"></i>
            Back to User List
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
