<div class="login-container">
  <div class="card login-card">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <h2 class="card-title fw-bold">Welcome Back</h2>
        <p class="text-muted">Sign in to your account</p>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="mb-3">
          <label for="email" class="form-label">Email or Username</label>
          <input
            type="text"
            class="form-control form-control-lg"
            id="email"
            [(ngModel)]="email"
            name="email"
            required
            placeholder="Enter your email or username"
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control form-control-lg"
            id="password"
            [(ngModel)]="password"
            name="password"
            required
            placeholder="Enter your password"
          />
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label" for="remember">
              Remember me
            </label>
          </div>
          <a href="#" class="text-decoration-none">Forgot Password?</a>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
          {{ errorMessage }}
          <button type="button" class="btn-close" (click)="errorMessage = ''" aria-label="Close"></button>
        </div>

        <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
          {{ successMessage }}
          <button type="button" class="btn-close" (click)="successMessage = ''" aria-label="Close"></button>
        </div>

        <button
          type="submit"
          class="btn btn-primary btn-lg w-100 mb-3"
          [disabled]="!loginForm.valid || isLoading"
        >
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Signing in...
          </span>
        </button>
      </form>

      <div class="text-center mt-4">
        <p class="mb-0">
          Don't have an account? 
          <a routerLink="/signup" class="text-decoration-none fw-bold">Sign Up</a>
        </p>
      </div>

      <div class="divider my-4">
        <span class="divider-text">OR</span>
      </div>

      <div class="social-login">
        <button class="btn btn-outline-secondary btn-lg w-100 mb-2">
          <i class="bi bi-google me-2"></i> Continue with Google
        </button>
        <button class="btn btn-outline-secondary btn-lg w-100">
          <i class="bi bi-github me-2"></i> Continue with GitHub
        </button>
      </div>
    </div>
  </div>

  <div class="demo-info mt-4 text-center">
    <p class="text-white-50 small">
      <strong>Demo Credentials:</strong><br>
      Email: john&#64;example.com | Password: password123<br>
      Email: jane&#64;example.com | Password: password456
    </p>
  </div>
</div>
