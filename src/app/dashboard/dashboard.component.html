<app-navbar></app-navbar>

<div class="dashboard-container">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card dashboard-card">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <div class="user-avatar">
                <span class="avatar-text">{{ currentUser?.fullName?.charAt(0) || 'U' }}</span>
              </div>
              <h2 class="mt-3 mb-2">Welcome, {{ currentUser?.fullName }}!</h2>
              <p class="text-muted">&#64;{{ currentUser?.username }}</p>
            </div>

            <div class="user-details">
              <div class="detail-item">
                <i class="bi bi-person-circle"></i>
                <div>
                  <small class="text-muted">Full Name</small>
                  <p class="mb-0 fw-semibold">{{ currentUser?.fullName }}</p>
                </div>
              </div>

              <div class="detail-item">
                <i class="bi bi-envelope"></i>
                <div>
                  <small class="text-muted">Email</small>
                  <p class="mb-0 fw-semibold">{{ currentUser?.email }}</p>
                </div>
              </div>

              <div class="detail-item">
                <i class="bi bi-person-badge"></i>
                <div>
                  <small class="text-muted">Username</small>
                  <p class="mb-0 fw-semibold">&#64;{{ currentUser?.username }}</p>
                </div>
              </div>

              <div class="detail-item">
                <i class="bi bi-shield-check"></i>
                <div>
                  <small class="text-muted">Account ID</small>
                  <p class="mb-0 fw-semibold">#{{ currentUser?.id }}</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="success-message mt-4">
          <div class="alert alert-success">
            <i class="bi bi-check-circle-fill me-2"></i>
            You have successfully logged in!
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
